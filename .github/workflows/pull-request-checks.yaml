name: pull-request-check

on:
  pull_request:
    branches: ['**']

jobs:
  pull-request-checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: "pnpm"

    - name: Install pnpm dependencies
      run: pnpm install

    - name: Run lint checks
      run: pnpm run lint

    - name: Diff check after lint
      run: git diff --exit-code

    - uses: peter-evans/create-or-update-comment@v4
      if: failure()
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          ## **You have lint errors in your pull request**
          ${{ steps.lint.outcome == 'failure'
            && 'Errors require manual fixes, make a new commit to make you PR mergeable'
            || 'Errors can be automatically fix by running `pnpm run lint`, make a new commit to make you PR mergeable' }}
